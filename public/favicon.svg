<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Giochi">
  <!--
    L'icona dell'app: un dado con i punti nei colori dei giochi, davanti a
    due tessere a ventaglio, sull'indaco dell'app. La scrive
    scripts/genera-icone.mjs, che ne fa anche i PNG: si cambia li'.
  -->
  <defs>
    <linearGradient id="fondo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="230" y2="512">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#4337d2"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#4fd96a"/>
      <stop offset="1" stop-color="#22b45e"/>
    </linearGradient>
    <linearGradient id="giallo" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffc54f"/>
      <stop offset="1" stop-color="#f2911f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#fondo)"/>

  <g id="disegno">
    <!-- Le tessere, aperte a ventaglio dietro il dado. -->
    <rect x="118" y="158" width="172" height="172" rx="42" fill="url(#verde)" transform="rotate(-17 204 244)"/>
    <rect x="222" y="158" width="172" height="172" rx="42" fill="url(#giallo)" transform="rotate(17 308 244)"/>

    <!-- Il dado, con il solco che lo stacca dalle tessere. -->
    <rect x="162" y="176" width="188" height="188" rx="48" fill="#fff" stroke="url(#fondo)" stroke-width="12"/>

    <!-- Il cinque, con i colori dei giochi e quello dell'app in mezzo. -->
    <circle cx="206" cy="220" r="19" fill="#22b45e"/>
    <circle cx="306" cy="220" r="19" fill="#f2911f"/>
    <circle cx="256" cy="270" r="19" fill="#4f46e5"/>
    <circle cx="206" cy="320" r="19" fill="#4d8df7"/>
    <circle cx="306" cy="320" r="19" fill="#f0506e"/>
  </g>
</svg>
