<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Giochi">
  <!--
    L'icona dell'app: le quattro copertine dei giochi, come le icone di una
    cartella sulla schermata Home. Gli stessi colori dei giochi in tokens.css,
    sul fondo della classifica generale, che e' la somma di tutti. (Niente
    doppi trattini in questo commento: in XML non sono ammessi, e un'immagine
    SVG con un commento non valido non si carica.)
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#6d5fff"/>
      <stop offset="1" stop-color="#3d2fc4"/>
    </linearGradient>
    <linearGradient id="wordle" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#34c759"/>
      <stop offset="1" stop-color="#0f9d58"/>
    </linearGradient>
    <linearGradient id="scarabeo" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#f7b23b"/>
      <stop offset="1" stop-color="#d9731a"/>
    </linearGradient>
    <linearGradient id="cruciverba" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#4d8df7"/>
      <stop offset="1" stop-color="#2a55c9"/>
    </linearGradient>
    <linearGradient id="battaglia" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#23a6c9"/>
      <stop offset="1" stop-color="#0d5f82"/>
    </linearGradient>
    <radialGradient id="luce" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1b1460" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect id="sfondo" width="512" height="512" rx="114" fill="url(#fondo)"/>
  <rect width="512" height="512" rx="114" fill="url(#luce)"/>

  <g filter="url(#ombra)">
    <!-- Wordle: una riga di tentativi. -->
    <rect x="98" y="98" width="148" height="148" rx="38" fill="url(#wordle)"/>
    <rect x="120" y="156" width="30" height="30" rx="8" fill="#fff" fill-opacity="0.95"/>
    <rect x="157" y="156" width="30" height="30" rx="8" fill="#fff" fill-opacity="0.5"/>
    <rect x="194" y="156" width="30" height="30" rx="8" fill="#fff" fill-opacity="0.95"/>

    <!-- Scarabeo: due tessere di legno. -->
    <rect x="266" y="98" width="148" height="148" rx="38" fill="url(#scarabeo)"/>
    <g transform="rotate(-10 318 172)">
      <rect x="290" y="146" width="54" height="54" rx="11" fill="#5a3a0c" fill-opacity="0.18"/>
      <rect x="290" y="142" width="54" height="54" rx="11" fill="#fff4dc"/>
      <rect x="306" y="156" width="8" height="26" rx="3" fill="#5a3a0c"/>
      <rect x="306" y="174" width="22" height="8" rx="3" fill="#5a3a0c"/>
    </g>
    <g transform="rotate(12 368 176)">
      <rect x="342" y="154" width="50" height="50" rx="10" fill="#5a3a0c" fill-opacity="0.18"/>
      <rect x="342" y="150" width="50" height="50" rx="10" fill="#fff4dc"/>
      <circle cx="367" cy="175" r="11" fill="none" stroke="#5a3a0c" stroke-width="8"/>
    </g>

    <!-- Cruciverba: una griglia con una casella nera. -->
    <rect x="98" y="266" width="148" height="148" rx="38" fill="url(#cruciverba)"/>
    <g fill="#fff" fill-opacity="0.95">
      <rect x="122" y="290" width="30" height="30" rx="6"/>
      <rect x="157" y="290" width="30" height="30" rx="6"/>
      <rect x="192" y="290" width="30" height="30" rx="6" fill-opacity="0.25"/>
      <rect x="122" y="325" width="30" height="30" rx="6"/>
      <rect x="157" y="325" width="30" height="30" rx="6" fill-opacity="0.25"/>
      <rect x="192" y="325" width="30" height="30" rx="6"/>
      <rect x="122" y="360" width="30" height="30" rx="6" fill-opacity="0.25"/>
      <rect x="157" y="360" width="30" height="30" rx="6"/>
      <rect x="192" y="360" width="30" height="30" rx="6"/>
    </g>

    <!-- Battaglia navale: un bersaglio. -->
    <rect x="266" y="266" width="148" height="148" rx="38" fill="url(#battaglia)"/>
    <circle cx="340" cy="340" r="44" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="9"/>
    <circle cx="340" cy="340" r="24" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="9"/>
    <circle cx="340" cy="340" r="7" fill="#fff"/>
  </g>
</svg>
