<!doctype html>
<html lang="it" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <script data-sottodomini>
      // I sottodomini dei giochi sono scorciatoie: portano all'indirizzo vero,
      // giochi.<dominio>/<gioco>, prima ancora che parta l'app. E' la stessa
      // regola di indirizzoCanonico in shared/hosts.ts, e un test li confronta.
      ;(function () {
        var giochi = { wordle: '/wordle', scarabeo: '/scarabeo', cruciverba: '/cruciverba', battaglia: '/battaglia-navale' }
        var parti = location.hostname.toLowerCase().replace(/\.$/, '').split('.')
        if (parti.length < 3 || !Object.prototype.hasOwnProperty.call(giochi, parti[0])) return
        var percorso = location.pathname === '/' || location.pathname === '' ? giochi[parti[0]] : location.pathname
        parti[0] = 'giochi'
        var porta = location.port ? ':' + location.port : ''
        location.replace(location.protocol + '//' + parti.join('.') + porta + percorso + location.search + location.hash)
      })()
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Giochi</title>
    <meta
      name="description"
      content="Wordle, Scarabeo, Cruciverba e Battaglia navale in italiano: una partita classificata al giorno, la stessa per tutti, e quante libere vuoi."
    />

    <!-- Le icone le fa npm run icone, che scrive anche l'impronta negli indirizzi. -->
    <link rel="icon" href="/favicon.svg?v=cdd019ff" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=cdd019ff" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=cdd019ff" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Si installa sulla Home e si apre come un'app, senza la barra del browser. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Giochi" />
    <meta name="application-name" content="Giochi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c11" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="Giochi" />
    <meta
      property="og:description"
      content="Wordle, Scarabeo, Cruciverba e Battaglia navale: una sfida al giorno, la stessa per tutti."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png?v=cdd019ff" />

    <script>
      // Applica il tema salvato prima del primo paint: evita il lampo di bianco.
      try {
        var t = localStorage.getItem('gh.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        else document.documentElement.removeAttribute('data-theme')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
