name: Scorte notturne

# Cinque cose che il Worker non puo' fare — ognuna costa piu' dei 10 ms di CPU
# di una richiesta — e che si preparano qui, ogni notte, in anticipo:
#
#  - gli schemi del cruciverba del giorno, fino a due mesi da oggi;
#  - gli schemi del cruciverba libero, trenta a notte fino a seicento;
#  - la partita del computer dello Scarabeo per ogni giornata, il riferimento
#    dei punti della classificata, fino a due mesi da oggi;
#  - i sudoku del giorno, fino a due mesi da oggi;
#  - le domande del quiz, fino a due mesi da oggi, e il riassunto dei dati da
#    Wikidata e Natural Earth per le partite libere;
#  - i punti di Nomi, cose e città delle giornate finite, se il workflow che
#    li conta a mezzanotte (nomi.yml) e' saltato.
#
# Gli script fanno solo quel che manca, e quel che hanno scritto non cambia
# piu': di solito una giornata per tipo. Due mesi perché un workflow
# programmato puo' fermarsi — GitHub sospende quelli dei repository senza
# attivita' dopo sessanta giorni — e in quel caso nessuno deve accorgersene
# aprendo un gioco.
on:
  schedule:
    # 03:17 UTC: dopo la mezzanotte italiana sia con l'ora solare sia con
    # quella legale, e fuori dall'ora piena in cui partono tutti i cron.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: cruciverba-scorta
  cancel-in-progress: false

jobs:
  scorta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Controllo dei segreti
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Manca CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID fra i segreti del repository (vedi DEPLOY.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cruciverba del giorno
        run: node scripts/genera-cruciverba.mjs --remote --giorni 60
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cruciverba liberi
        run: node scripts/genera-cruciverba.mjs --remote --liberi 600 --al-massimo 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Il computer dello Scarabeo
        run: npx vite-node scripts/genera-computer-scarabeo.ts -- --remote --giorni 60
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Il sudoku
        run: npx vite-node scripts/genera-sudoku.ts -- --remote --giorni 60
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Il quiz
        run: npx vite-node scripts/genera-quiz.ts -- --remote --giorni 60
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: I punti di Nomi, cose e città
        run: npx vite-node scripts/punteggi-nomi.ts -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
