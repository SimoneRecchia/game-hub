name: Deploy

# Il progetto Pages è di tipo "direct upload": non è collegato a Git, quindi il
# deploy automatico passa da qui invece che dal build integrato di Cloudflare.
#
# Serve, una volta sola, in Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN    permessi: Cloudflare Pages:Edit, D1:Edit
#   CLOUDFLARE_ACCOUNT_ID   l'ID dell'account (vedi DEPLOY.md)
on:
  push:
    branches: [main]
  # Utile per ripubblicare senza dover fare un commit.
  workflow_dispatch:

# Un deploy alla volta: due push ravvicinati non devono pubblicare fuori ordine.
concurrency:
  group: deploy-produzione
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    # Il primo deploy del cruciverba genera due settimane di schemi, qualche
    # secondo l'uno: il margine e' per quello, i deploy normali restano sotto i
    # cinque minuti.
    timeout-minutes: 25
    environment:
      name: produzione
      url: https://giochi.simonerecchia.com

    steps:
      # Senza i segreti il deploy non puo' funzionare. Meglio fermarsi qui con
      # un messaggio che dice cosa manca, che far fallire wrangler con un
      # errore di autenticazione — o, peggio, lasciare una X rossa su main che
      # sembra un problema del codice.
      #
      # Con un'eccezione: se la run e' stata chiesta a mano. Chi premi "Run
      # workflow" si aspetta un deploy, e una spunta verde su una run che ha
      # saltato tutto e' peggio di un errore — verificato di persona, il verde
      # ci ha fatto credere per un giorno che il deploy automatico funzionasse.
      - name: Controllo dei segreti
        id: segreti
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "pronto=si" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy non eseguito"
              echo
              echo "Mancano i segreti del repository. Da aggiungere una volta sola in"
              echo "**Settings → Secrets and variables → Actions**:"
              echo
              echo "| Segreto | Presente |"
              echo "| --- | --- |"
              echo "| \`CLOUDFLARE_API_TOKEN\` | $([ -n "$TOKEN" ] && echo sì || echo '**no**') |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | $([ -n "$ACCOUNT" ] && echo sì || echo '**no**') |"
              echo
              echo "I valori sono in [DEPLOY.md](../blob/main/DEPLOY.md)."
              echo "Fino ad allora si pubblica a mano con \`npx wrangler pages deploy dist\`."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$EVENTO" = 'workflow_dispatch' ]; then
              echo "::error::Deploy non eseguito: manca CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID fra i segreti del repository."
              exit 1
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.segreti.outputs.pronto == 'si'

      - uses: actions/setup-node@v4
        if: steps.segreti.outputs.pronto == 'si'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.segreti.outputs.pronto == 'si'

      # Le stesse verifiche della CI: non si pubblica su main qualcosa che non
      # passa i test, anche se la CI girasse in parallelo.
      - name: Typecheck
        if: steps.segreti.outputs.pronto == 'si'
        run: npm run typecheck

      - name: Test
        if: steps.segreti.outputs.pronto == 'si'
        run: npm run test

      # CF_PAGES attiva il controllo sul database_id: qui e' corretto, perché
      # questo build finisce davvero in produzione.
      - name: Build
        if: steps.segreti.outputs.pronto == 'si'
        run: npm run build
        env:
          CF_PAGES: '1'

      # Il punto del database prima delle migrazioni, nel log: D1 tiene la sua
      # storia (Time Travel) e con questo segnalibro si torna a com'era, se una
      # migrazione che rifà una tabella andasse storta
      # (`wrangler d1 time-travel restore game-hub-db --bookmark=...`). Non
      # ferma il deploy: e' una rete, non un controllo.
      - name: Segnalibro del database
        if: steps.segreti.outputs.pronto == 'si'
        continue-on-error: true
        run: npx wrangler d1 time-travel info game-hub-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Le migrazioni prima della pubblicazione: il codice nuovo potrebbe
      # cercare tabelle che ancora non esistono. `migrations apply` non fa
      # nulla se sono già applicate.
      - name: Migrazioni D1
        if: steps.segreti.outputs.pronto == 'si'
        run: npx wrangler d1 migrations apply game-hub-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Il codice nuovo potrebbe servire il cruciverba di oggi, uno schema
      # libero, il computer dello Scarabeo, il sudoku, il quiz, gli anagrammi,
      # la Ghigliottina, il Paroliere o la Catena di oggi: devono esserci prima. Qui
      # bastano due settimane e venti schemi liberi per livello, la scorta lunga la tiene
      # il workflow notturno (cruciverba.yml). Gli script fanno solo quel che
      # manca, quindi di solito non fanno niente.
      - name: Scorta dei cruciverba
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          node scripts/genera-cruciverba.mjs --remote --giorni 14
          node scripts/genera-cruciverba.mjs --remote --liberi 20 --al-massimo 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Il computer dello Scarabeo
        if: steps.segreti.outputs.pronto == 'si'
        run: npx vite-node scripts/genera-computer-scarabeo.ts -- --remote --giorni 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Il sudoku
        if: steps.segreti.outputs.pronto == 'si'
        run: npx vite-node scripts/genera-sudoku.ts -- --remote --giorni 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Gli anagrammi vengono da un elenco versionato: non vanno in rete, e non falliscono per altri.
      - name: Gli anagrammi
        if: steps.segreti.outputs.pronto == 'si'
        run: npx vite-node scripts/genera-anagrammi.ts -- --remote --giorni 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # La Ghigliottina viene da un elenco versionato, il Paroliere dal dizionario dello Scarabeo, anche lui
      # versionato: come gli anagrammi, non vanno in rete.
      - name: La Ghigliottina
        if: steps.segreti.outputs.pronto == 'si'
        run: npx vite-node scripts/genera-ghigliottina.ts -- --remote --giorni 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Il Paroliere
        if: steps.segreti.outputs.pronto == 'si'
        run: npx vite-node scripts/genera-paroliere.ts -- --remote --giorni 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Anche la Catena viene da un elenco versionato, e va dopo la Ghigliottina, di cui evita la parola vincente.
      - name: La Catena
        if: steps.segreti.outputs.pronto == 'si'
        run: npx vite-node scripts/genera-catena.ts -- --remote --giorni 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Le domande del quiz vengono da Wikidata e da Natural Earth: servizi di
      # altri, che possono non rispondere. Se manca qualcosa ci prova; se non ci
      # riesce la pubblicazione va avanti lo stesso — il quiz dice "non ancora
      # pronto" finché il workflow notturno non ci riesce lui.
      - name: Il quiz
        if: steps.segreti.outputs.pronto == 'si'
        continue-on-error: true
        run: npx vite-node scripts/genera-quiz.ts -- --remote --giorni 14 --se-manca
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # I punti di Nomi, cose e città delle giornate finite e non ancora
      # contate: di solito nessuna, ci pensa nomi.yml a mezzanotte. Non ferma
      # la pubblicazione: una giornata non contata resta "in attesa".
      - name: I punti di Nomi, cose e città
        if: steps.segreti.outputs.pronto == 'si'
        continue-on-error: true
        run: npx vite-node scripts/punteggi-nomi.ts -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Le statistiche di Cloudflare nel pannello admin vogliono un token in sola
      # lettura fra i secret del progetto Pages. Basta metterlo una volta fra i
      # segreti del repository (CF_STATS_TOKEN, e CF_ZONE_ID per il traffico di
      # tutto il dominio): il deploy lo porta alle Pages, con l'ID dell'account
      # che ha gia'. Il sito delle Web Analytics sta in wrangler.toml, che non e'
      # un segreto, e una variabile e un secret con lo stesso nome non stanno
      # insieme. Prima della pubblicazione, perché un secret vale dal deploy
      # dopo. Non lo ferma: senza, il pannello dice che cosa manca.
      - name: I segreti del pannello
        if: steps.segreti.outputs.pronto == 'si'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_TOKEN: ${{ secrets.CF_STATS_TOKEN }}
          ZONA: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "CF_STATS_TOKEN non c'e': le statistiche di Cloudflare restano spente."
            exit 0
          fi
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler pages secret put CF_ACCOUNT_ID --project-name game-hub
          printf '%s' "$STATS_TOKEN" | npx wrangler pages secret put CF_API_TOKEN --project-name game-hub
          if [ -n "$ZONA" ]; then
            printf '%s' "$ZONA" | npx wrangler pages secret put CF_ZONE_ID --project-name game-hub
          fi

      - name: Pubblica su Cloudflare Pages
        if: steps.segreti.outputs.pronto == 'si'
        run: npx wrangler pages deploy dist --project-name game-hub --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Se l'API non risponde, il deploy va considerato fallito: meglio
      # accorgersene qui che dal primo collega che apre il sito.
      - name: Verifica
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          for host in giochi.simonerecchia.com wordle.simonerecchia.com; do
            echo -n "  $host → "
            code=$(curl -sS --retry 5 --retry-delay 4 --retry-all-errors \
                     -o /tmp/health.json -w '%{http_code}' "https://$host/api/health")
            echo "$code $(cat /tmp/health.json)"
            [ "$code" = "200" ] || exit 1
            grep -q '"ok":true' /tmp/health.json || exit 1
          done
