name: CI

# Gira sui push verso main e su ogni pull request: sono le due occasioni in cui
# un errore costerebbe caro (un deploy rotto o una revisione su codice che non
# compila).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tre progetti TypeScript separati (app, worker, script di build):
      # `tsc -b` li verifica tutti.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Il build senza CF_PAGES, cioe' quello che esegue un contributore in
      # locale. Impostare CF_PAGES qui sarebbe sbagliato: attiverebbe il
      # controllo di configurazione, che deve fallire finché il progetto non
      # e' collegato a un database D1 reale — e non e' compito della CI
      # decidere se l'ambiente di produzione e' configurato.
      # Il controllo ha i suoi test in scripts/__tests__.
      - name: Build
        run: npm run build
