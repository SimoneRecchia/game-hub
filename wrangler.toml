#:schema node_modules/wrangler/config-schema.json
#
# Configurazione Cloudflare Pages.
#
# Perché il database_id sta qui e non nella dashboard: e' un identificativo
# dell'account, non un segreto, e tenerlo versionato rende la configurazione
# ricostruibile. Il rovescio e' che un ID sbagliato romperebbe la produzione,
# quindi `npm run build` lo controlla quando CF_PAGES e' impostata
# (scripts/check-config.mjs), cioe' nei build che finiscono davvero online.
#
# In sviluppo locale l'ID non viene guardato: wrangler crea un SQLite dentro
# .wrangler/state/ indicizzato per ID, quindi cambiarlo azzera il database
# locale (non quello di produzione).

name = "game-hub"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "game-hub-db"
database_id = "5b224eb2-435b-459e-ac8a-13f34a972578"

[vars]
# Dominio su cui vale il cookie di sessione.
#
# Hub e giochi stanno su sottodomini diversi (giochi.simonerecchia.com,
# wordle.simonerecchia.com): senza questo, il cookie resterebbe legato al
# singolo host e chi accede sull'hub risulterebbe sconosciuto sul gioco.
#
# Viene applicato solo quando copre davvero l'host della richiesta, quindi su
# *.pages.dev e in locale il cookie resta del singolo host: vedi
# `cookieDomainFor` in shared/hosts.ts.
COOKIE_DOMAIN = "simonerecchia.com"

# Mittente delle email con i codici di verifica.
#
# Il dominio verificato su Resend e' il sottodominio `mail.simonerecchia.com`,
# non la radice: i record MX di Resend sulla radice impedirebbero di ricevere
# posta su @simonerecchia.com. Il mittente deve stare nel dominio verificato,
# quindi se un giorno si cambia dominio su Resend va cambiato anche qui.
EMAIL_FROM = "Game Hub <giochi@mail.simonerecchia.com>"

# Verifica dell'email al momento della registrazione.
#
# Accesa: la chiave Resend e' fra i secret del progetto Pages e il dominio
# mittente e' verificato. Le due cose vanno insieme — `emailVerificationEnabled`
# le controlla entrambe — perché accendere la verifica senza il modo di spedire
# i codici bloccherebbe ogni registrazione.
#
# Per spegnerla in fretta, se la posta si rompe: "off" qui, commit e push. La
# registrazione torna a raccogliere l'email senza verificarla, e il recupero
# password risponde che l'invio non e' configurato.
#
# La chiave e' un segreto e non va in questo file: vedi DEPLOY.md.
EMAIL_VERIFICATION = "on"

# I proprietari del pannello di amministrazione (giochi.simonerecchia.com/admin),
# separati da virgole. Chi entra con una di queste email, confermata, apre il
# pannello dopo un codice mandato all'email, e dal pannello puo' nominare altri
# amministratori. Vedi server/lib/admin.ts.
ADMIN_EMAILS = "recchia.sim@gmail.com"

# Il sito dei giochi nelle Web Analytics di Cloudflare (il «site tag» del
# progetto game-hub, quello che conta solo le visite dei giochi e non il resto
# del dominio): il pannello ne legge le visite. Non e' un segreto — per leggerle
# serve il token — e sta qui invece che fra i secret delle Pages.
CF_WEB_ANALYTICS_TAG = "8ff04dff55c640659dc436c7bdb2b410"

# Le statistiche di Cloudflare nel pannello vogliono anche CF_ACCOUNT_ID e
# CF_API_TOKEN (e, se si vuole il traffico di tutto il dominio, CF_ZONE_ID) come
# secret del progetto Pages, non qui: vedi DEPLOY.md.
