#:schema node_modules/wrangler/config-schema.json
#
# Configurazione Cloudflare Pages.
#
# Perché il database_id sta qui e non nella dashboard: e' un identificativo
# dell'account, non un segreto, e tenerlo versionato rende la configurazione
# ricostruibile. Il rovescio e' che un ID sbagliato romperebbe la produzione,
# quindi `npm run build` lo controlla quando CF_PAGES e' impostata
# (scripts/check-config.mjs), cioe' nei build che finiscono davvero online.
#
# In sviluppo locale l'ID non viene guardato: wrangler crea un SQLite dentro
# .wrangler/state/ indicizzato per ID, quindi cambiarlo azzera il database
# locale (non quello di produzione).

name = "game-hub"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "game-hub-db"
database_id = "5b224eb2-435b-459e-ac8a-13f34a972578"

[vars]
# Dominio su cui vale il cookie di sessione.
#
# Hub e giochi stanno su sottodomini diversi (giochi.simonerecchia.com,
# wordle.simonerecchia.com): senza questo, il cookie resterebbe legato al
# singolo host e chi accede sull'hub risulterebbe sconosciuto sul gioco.
#
# Viene applicato solo quando copre davvero l'host della richiesta, quindi su
# *.pages.dev e in locale il cookie resta del singolo host: vedi
# `cookieDomainFor` in shared/hosts.ts.
COOKIE_DOMAIN = "simonerecchia.com"
