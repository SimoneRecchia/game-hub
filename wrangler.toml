#:schema node_modules/wrangler/config-schema.json
#
# Configurazione Cloudflare Pages.
#
# ⚠️  PRIMA DEL PRIMO DEPLOY: sostituisci `database_id` qui sotto con l'ID del
#     tuo database D1. Lo ottieni con `npx wrangler d1 create game-hub-db`.
#     Vedi DEPLOY.md, passo 1. In sviluppo locale il valore non conta.
#
# Perché l'ID sta qui e non nella dashboard: quando questo file contiene
# `pages_build_output_dir`, Cloudflare Pages lo usa come unica fonte per i
# binding e ignora quelli impostati nella dashboard. Tenerlo qui rende la
# configurazione versionata e ricostruibile; il rovescio e' che un ID
# sbagliato romperebbe la produzione, quindi `npm run build` lo controlla
# durante i build su Pages (scripts/check-config.mjs).

name = "game-hub"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "game-hub-db"
database_id = "SOSTITUISCI_CON_IL_TUO_D1_DATABASE_ID"

[vars]
# Dominio su cui vale il cookie di sessione.
#
# Hub e giochi stanno su sottodomini diversi (giochi.simonerecchia.com,
# wordle.simonerecchia.com): senza questo, il cookie resterebbe legato al
# singolo host e chi accede sull'hub risulterebbe sconosciuto sul gioco.
#
# Viene applicato solo quando copre davvero l'host della richiesta, quindi su
# *.pages.dev e in locale il cookie resta del singolo host: vedi
# `cookieDomainFor` in shared/hosts.ts.
COOKIE_DOMAIN = "simonerecchia.com"
